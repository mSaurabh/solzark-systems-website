<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; padding: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <!--
  ╔══════════════════════════════════════════════════════╗
  ║   SOLZARK SYSTEMS LLC — EMAIL SIGNATURE              ║
  ║   Copy everything inside the <table> below           ║
  ║   and paste into Gmail signature editor (HTML mode)  ║
  ╚══════════════════════════════════════════════════════╝
-->

    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="font-family: 'Montserrat', Arial, sans-serif; border-collapse: collapse;"
    >
      <tr>
        <!-- LEFT: Logo — 24px on ALL four sides so it's centred between the left edge and the divider -->
        <td
          valign="middle"
          align="center"
          style="padding: 12px 24px 12px 24px;"
        >
          <img
            src="https://solzarksystems.com/assets/logos/IconOnly_Transparent_NoBuffer.png"
            alt="Solzark Systems"
            width="100"
            height="100"
            style="display:block; border:0; width:100px; height:100px; object-fit:contain;"
          />
        </td>

        <!-- VERTICAL DIVIDER -->
        <td style="width:1px; background-color:#461D7C; padding:0;">&nbsp;</td>

        <!-- RIGHT: Info — matching 24px on all sides -->
        <td valign="middle" style="padding: 12px 24px 12px 24px;">
          <!-- Name -->
          <p
            style="margin:0 0 2px 0;
                font-family:'Montserrat',Arial,sans-serif;
                font-size:16px;
                font-weight:700;
                color:#1a0d30;
                letter-spacing:-0.3px;
                line-height:1.2;"
          >
            Saurabh Mankar
          </p>

          <!-- Title + Company -->
          <p
            style="margin:0 0 8px 0;
                font-family:'Montserrat',Arial,sans-serif;
                font-size:11px;
                font-weight:600;
                color:#461D7C;
                letter-spacing:0.08em;
                text-transform:uppercase;
                line-height:1.4;"
          >
            Founder&nbsp;&nbsp;·&nbsp;&nbsp;Solzark Systems LLC
          </p>

          <!-- Gold → Purple rule -->
          <div
            style="width:180px; height:2px; background:linear-gradient(90deg,#FDD023,#461D7C); margin-bottom:8px;"
          ></div>

          <!-- Email -->
          <p
            style="margin:0 0 3px 0;
                font-family:'Montserrat',Arial,sans-serif;
                font-size:11px;
                font-weight:500;
                color:#333333;
                line-height:1.5;"
          >
            <a
              href="mailto:saurabh.mankar@solzarksystems.com"
              style="color:#461D7C; text-decoration:none;"
            >
              saurabh.mankar@solzarksystems.com
            </a>
          </p>

          <!-- Phone -->
          <p
            style="margin:0 0 3px 0;
                font-family:'Montserrat',Arial,sans-serif;
                font-size:11px;
                font-weight:500;
                color:#555555;
                line-height:1.5;"
          >
            <a
              href="tel:+13309990690"
              style="color:#555555; text-decoration:none;"
            >
              330-999-0690
            </a>
          </p>

          <!-- Website -->
          <p
            style="margin:0;
                font-family:'Montserrat',Arial,sans-serif;
                font-size:11px;
                font-weight:500;
                color:#555555;
                line-height:1.5;"
          >
            <a
              href="https://solzarksystems.com"
              style="color:#461D7C; text-decoration:none;"
            >
              solzarksystems.com
            </a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
